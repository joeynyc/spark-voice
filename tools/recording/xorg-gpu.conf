# A screen-less X server on the Spark's GPU, used only to record demo videos in 4K.
# start-gpu-display.sh fills in this machine's BusID.
Section "ServerLayout"
    Identifier "rec"
    Screen 0 "Screen0"
EndSection
Section "Device"
    Identifier "GPU0"
    Driver "nvidia"
    BusID "PCI:1@15:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "GPU0"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "true"
    SubSection "Display"
        Depth 24
        Virtual 3840 2160
    EndSubSection
EndSection
